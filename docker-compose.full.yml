# Self-contained Mailgeko stack: bundles MariaDB, Redis and Postgres+pgvector.
# Only JWT_SECRET is required. Run:
#   cp .env.example .env   # set JWT_SECRET
#   docker compose -f docker-compose.full.yml up --build
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: mailgeko
      MARIADB_DATABASE: mailgeko
      MARIADB_USER: mailgeko
      MARIADB_PASSWORD: mailgeko
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  pg:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mailgeko
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mailgeko"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  init-db:
    image: mariadb:11
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in 0001_init.sql 0002_domain.sql 0006_billing.sql 0007_settings.sql 0008_sending_defaults.sql; do
          echo ">> mysql: $f"
          mariadb -h db -uroot -pmailgeko mailgeko < "/migrations/$f"
        done
        echo "mysql migrations applied"
    restart: "no"

  init-pg:
    image: pgvector/pgvector:pg16
    depends_on:
      pg:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in 0003_analytics.sql 0004_analytics_enrichment.sql 0005_embeddings.sql; do
          echo ">> postgres: $f"
          psql "postgres://postgres:postgres@pg:5432/mailgeko?sslmode=disable" -f "/migrations/$f"
        done
        echo "postgres migrations applied"
    restart: "no"

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "8080"
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      TIDB_DSN: "mailgeko:mailgeko@tcp(db:3306)/mailgeko?parseTime=true&charset=utf8mb4"
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: "postgres://postgres:postgres@pg:5432/mailgeko?sslmode=disable"
      RESEND_API_KEYS: ${RESEND_API_KEYS:-re_dev_placeholder}
      RESEND_API_ENDPOINT: ${RESEND_API_ENDPOINT:-https://api.resend.com/emails}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-static}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      EMBED_MODEL: ${EMBED_MODEL:-}
      EMBED_DIMENSIONS: ${EMBED_DIMENSIONS:-1536}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_GROWTH: ${STRIPE_PRICE_GROWTH:-}
      STRIPE_PRICE_SCALE: ${STRIPE_PRICE_SCALE:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
      init-pg:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  dbdata:
  pgdata:
