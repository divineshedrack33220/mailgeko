services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "8080"
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1/32,::1/128}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      MAILGEKO_ROLE: ${MAILGEKO_ROLE:-all}
      TIDB_DSN: ${TIDB_DSN:?set TIDB_DSN}
      POSTGRES_DSN: ${POSTGRES_DSN:-}
      REDIS_ADDR: ${REDIS_ADDR:?set REDIS_ADDR}
      RESEND_API_KEYS: ${RESEND_API_KEYS:-re_dev_placeholder}
      RESEND_API_ENDPOINT: ${RESEND_API_ENDPOINT:-https://api.resend.com/emails}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-static}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-}
      EMBED_DIMENSIONS: ${EMBED_DIMENSIONS:-1536}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_GROWTH: ${STRIPE_PRICE_GROWTH:-}
      STRIPE_PRICE_SCALE: ${STRIPE_PRICE_SCALE:-}
    restart: unless-stopped
